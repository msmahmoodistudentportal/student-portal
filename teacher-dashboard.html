<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>داشبورد معلم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      color: #1d4ed8;
    }

    .logout {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .logout:hover {
      background: #dc2626;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .welcome h2 {
      margin-top: 0;
      color: #111827;
    }

    .user-info {
      color: #6b7280;
      line-height: 2;
    }

    .section-title {
      margin: 30px 0 15px;
      font-size: 20px;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .activity-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .activity-card h3 {
      margin-top: 0;
      color: #1d4ed8;
      line-height: 1.7;
    }

    .meta {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
      line-height: 2.2;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      margin-top: 10px;
    }

    .file-link {
      display: inline-block;
      margin-top: 6px;
      color: #2563eb;
      text-decoration: none;
    }

    .file-link:hover {
      text-decoration: underline;
    }

    .grade-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .grade-result {
      margin-bottom: 14px;
      color: #4b5563;
      line-height: 2;
    }

    .grade-box label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 13px;
    }

    .grade-box input,
    .grade-box textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    .grade-box textarea {
      min-height: 76px;
      resize: vertical;
    }

    .grade-button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .grade-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .grade-message {
      margin-top: 10px;
      line-height: 1.8;
    }

    .grade-message.success {
      color: #166534;
    }

    .grade-message.error {
      background: transparent;
      color: #991b1b;
      padding: 0;
    }

    .empty,
    .loading {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #6b7280;
    }

    .loading {
      color: #2563eb;
    }

    .assignment-box {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .assignment-box h2 {
      margin-top: 0;
      color: #111827;
    }

    .assignment-field {
      margin-bottom: 16px;
    }

    .assignment-field label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 13px;
    }

    .assignment-field input,
    .assignment-field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    .assignment-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .assignment-button {
      border: none;
      background: #16a34a;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .assignment-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .assignment-message {
      margin-top: 12px;
      line-height: 1.8;
    }

    .assignment-message.success {
      color: #166534;
    }

    .assignment-message.error {
      color: #991b1b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 10px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .header h1 {
        font-size: 18px;
      }

      .container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>داشبورد معلم</h1>

    <button class="logout" onclick="logout()">
      خروج
    </button>
  </header>

  <main class="container">
    <section class="welcome">
      <h2 id="welcomeMessage">در حال بارگذاری...</h2>

      <div class="user-info">
        <div>
          <strong>نام کاربری:</strong>
          <span id="username">-</span>
        </div>

        <div>
          <strong>شناسه معلم:</strong>
          <span id="userId">-</span>
        </div>
      </div>
    </section>

    <section class="assignment-box">
      <h2>ایجاد تکلیف جدید</h2>

      <div class="assignment-field">
        <label for="assignmentTitle">عنوان تکلیف</label>
        <input type="text" id="assignmentTitle" placeholder="مثلاً: تکلیف فصل اول">
      </div>

      <div class="assignment-field">
        <label for="assignmentDescription">توضیحات</label>
        <textarea id="assignmentDescription" placeholder="توضیحات مربوط به تکلیف..."></textarea>
      </div>

      <div class="assignment-field">
        <label for="assignmentClassId">ClassID</label>
        <input type="text" id="assignmentClassId" value="CLS-TEST-001">
      </div>

      <div class="assignment-field">
        <label for="assignmentDeadline">مهلت ارسال</label>
        <input type="date" id="assignmentDeadline">
      </div>

      <button type="button" class="assignment-button" id="createAssignmentButton">
        ایجاد تکلیف
      </button>

      <div id="assignmentMessage" class="assignment-message" aria-live="polite"></div>
    </section>

    <h2 class="section-title">📚 فعالیت‌های ارسالی دانش‌آموزان</h2>

    <section id="activitiesContainer">
      <div class="loading">در حال دریافت فعالیت‌ها...</div>
    </section>
  </main>

  <script>
    function toPersianDate(input) {
      const date = new Date(input);
      const gy = date.getUTCFullYear();
      const gm = date.getUTCMonth() + 1;
      const gd = date.getUTCDate();

      function div(a, b) { return Math.floor(a / b); }

      let gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = 355666 + (365 * gy) + div(gy2 + 399, 400) - div(gy2 + 99, 100) + div(gy2, 4) + gd + [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334][gm - 1];

      let jy = -1595 + (33 * div(days, 12053));
      days %= 12053;
      jy += 4 * div(days, 1461);
      days %= 1461;
      if (days > 365) {
        jy += div(days - 1, 365);
        days = (days - 1) % 365;
      }

      let jm, jd;
      if (days < 186) {
        jm = 1 + div(days, 31);
        jd = 1 + (days % 31);
      } else {
        jm = 7 + div(days - 186, 30);
        jd = 1 + ((days - 186) % 30);
      }

      const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      function toPersianNum(n) {
        return String(n).split('').map(d => persianDigits[d] || d).join('');
      }

      return toPersianNum(jy) + '/' + toPersianNum(String(jm).padStart(2, '0')) + '/' + toPersianNum(String(jd).padStart(2, '0'));
    }

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx-9uxxqe9EXAsWLSD8QZ5vrsKQUbjnH-uL9sC_SpDQnp8EKqjztJDcKnu_zx_lFfya/exec";

    const sessionId = localStorage.getItem("sessionId");
    const userData = localStorage.getItem("user");
    const container = document.getElementById("activitiesContainer");
    const createAssignmentButton = document.getElementById("createAssignmentButton");
    const assignmentMessage = document.getElementById("assignmentMessage");

    if (!sessionId || !userData) {
      window.location.href = "index.html";
    }

    let user;

    try {
      user = JSON.parse(userData);
    } catch (error) {
      localStorage.clear();
      window.location.href = "index.html";
    }

    if (!user || user.role !== "Teacher") {
      container.innerHTML = `
        <div class="error">
          دسترسی به داشبورد معلم مجاز نیست.
        </div>
      `;
    } else {
      document.getElementById("welcomeMessage").textContent =
        `سلام ${user.firstName || "معلم"} ${user.lastName || "عزیز"} 🌷`;
      document.getElementById("username").textContent = user.username || user.userId || "-";
      document.getElementById("userId").textContent = user.userId || "-";
      document.getElementById("assignmentClassId").value = user.classId || "CLS-TEST-001";
      createAssignmentButton.addEventListener("click", createAssignment);
      loadActivities();
    }

    async function createAssignment() {
      const titleInput = document.getElementById("assignmentTitle");
      const descriptionInput = document.getElementById("assignmentDescription");
      const classIdInput = document.getElementById("assignmentClassId");
      const deadlineInput = document.getElementById("assignmentDeadline");

      const title = titleInput.value.trim();
      const classId = classIdInput.value.trim();

      if (!title || !classId || !deadlineInput.value) {
        assignmentMessage.className = "assignment-message error";
        assignmentMessage.textContent = "عنوان، ClassID و مهلت ارسال را وارد کنید.";
        return;
      }

      createAssignmentButton.disabled = true;
      assignmentMessage.className = "assignment-message";
      assignmentMessage.textContent = "در حال ایجاد تکلیف...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "createAssignment",
            sessionId: sessionId,
            title: title,
            description: descriptionInput.value.trim(),
            classId: classId,
            deadline: deadlineInput.value
          })
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || result.message || "ایجاد تکلیف ناموفق بود.");
        }

        assignmentMessage.className = "assignment-message success";
        assignmentMessage.textContent = "تکلیف با موفقیت ایجاد شد.";
        titleInput.value = "";
        descriptionInput.value = "";
        deadlineInput.value = "";
      } catch (error) {
        console.error(error);
        assignmentMessage.className = "assignment-message error";
        assignmentMessage.textContent = error.message;
      } finally {
        createAssignmentButton.disabled = false;
      }
    }

    async function loadActivities() {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "getTeacherActivities",
            sessionId: sessionId
          })
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || result.message || "دریافت فعالیت‌ها ناموفق بود.");
        }

        const activities = result.activities || [];

        if (activities.length === 0) {
          container.innerHTML = `
            <div class="empty">
              هنوز فعالیتی از طرف دانش‌آموزان ارسال نشده است. 📭
            </div>
          `;
          return;
        }

        container.innerHTML = '<div class="activities"></div>';
        const activitiesGrid = container.querySelector(".activities");

        activities.forEach(activity => {
          const card = document.createElement("article");
          card.className = "activity-card";

          const submittedDate = activity.submittedAt
            ? toPersianDate(activity.submittedAt)
            : "-";

          const fileUrl = activity.storageFileId
            ? `https://drive.google.com/file/d/${encodeURIComponent(activity.storageFileId)}/view`
            : "";

          const fileLink = fileUrl
            ? `<a class="file-link" href="${fileUrl}" target="_blank" rel="noopener noreferrer">${activity.fileType === "Image" ? "مشاهده عکس" : "مشاهده PDF"}</a>`
            : "<span>لینک فایل موجود نیست</span>";

          card.innerHTML = `
            <h3>📘 ${escapeHtml(activity.title || "بدون عنوان")}</h3>

            <div class="meta">
              <div>
                👤 دانش‌آموز:
                ${escapeHtml(activity.studentName || activity.studentId || "-")}
              </div>

              <div>
                📄 فایل:
                ${escapeHtml(activity.fileName || "-")}
                <br>
                ${fileLink}
              </div>

              <div>
                🕒 تاریخ ارسال:
                ${escapeHtml(submittedDate)}
              </div>

              <div class="status">
                وضعیت: ${escapeHtml(activity.status || "-")}
              </div>
            </div>

            <div class="grade-box">
              <div class="grade-result">
                <div class="saved-score">
                  نمره ثبت‌شده:
                  ${escapeHtml(activity.score === "" || activity.score == null ? "ثبت نشده" : activity.score)}
                </div>
                <div class="saved-comment">
                  نظر ثبت‌شده:
                  ${escapeHtml(activity.teacherComment || "ثبت نشده")}
                </div>
              </div>

              <label for="score-${escapeHtml(activity.activityId)}">نمره</label>
              <input
                type="number"
                class="score-input"
                id="score-${escapeHtml(activity.activityId)}"
                value="${escapeHtml(activity.score === "" || activity.score == null ? "" : activity.score)}"
                min="0"
                max="20"
                step="0.01"
                placeholder="مثلاً ۱۸.۵"
              >

              <label for="comment-${escapeHtml(activity.activityId)}">نظر معلم</label>
              <textarea
                class="comment-input"
                id="comment-${escapeHtml(activity.activityId)}"
                placeholder="نظر خود را وارد کنید..."
              >${escapeHtml(activity.teacherComment || "")}</textarea>

              <button type="button" class="grade-button">ثبت نمره</button>
              <div class="grade-message" aria-live="polite"></div>
            </div>
          `;

          const gradeButton = card.querySelector(".grade-button");
          const scoreInput = card.querySelector(".score-input");
          const commentInput = card.querySelector(".comment-input");
          const gradeMessage = card.querySelector(".grade-message");
          const savedScore = card.querySelector(".saved-score");
          const savedComment = card.querySelector(".saved-comment");

          gradeButton.addEventListener("click", async () => {
            gradeButton.disabled = true;
            gradeMessage.className = "grade-message";
            gradeMessage.textContent = "در حال ثبت...";

            try {
              const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                  "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                  action: "submitGrade",
                  sessionId: sessionId,
                  activityId: activity.activityId,
                  score: scoreInput.value,
                  teacherComment: commentInput.value
                })
              });

              const result = await response.json();

              if (!result.success) {
                throw new Error(result.error || result.message || "ثبت نمره ناموفق بود.");
              }

              gradeMessage.className = "grade-message success";
              gradeMessage.textContent = "نمره و نظر با موفقیت ثبت شد.";
              savedScore.textContent =
                `نمره ثبت‌شده: ${scoreInput.value || "ثبت نشده"}`;
              savedComment.textContent =
                `نظر ثبت‌شده: ${commentInput.value || "ثبت نشده"}`;
            } catch (error) {
              console.error(error);
              gradeMessage.className = "grade-message error";
              gradeMessage.textContent = error.message;
            } finally {
              gradeButton.disabled = false;
            }
          });

          activitiesGrid.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="error">
            دریافت فعالیت‌ها با خطا مواجه شد.
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function logout() {
      localStorage.removeItem("sessionId");
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
