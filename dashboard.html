<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سامانه دانش‌آموزی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      color: #1d4ed8;
    }

    .logout {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
      color: #111827;
    }

    .user-info {
      color: #6b7280;
      line-height: 2;
    }

    .section-title {
      margin: 30px 0 15px;
      font-size: 20px;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .activity-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .activity-card h3 {
      margin-top: 0;
      color: #1d4ed8;
    }

    .description {
      color: #4b5563;
      line-height: 1.8;
    }

    .meta {
      margin-top: 15px;
      font-size: 13px;
      color: #6b7280;
      line-height: 2;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #6b7280;
    }

    .loading {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #2563eb;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 10px;
      line-height: 1.8;
    }
.upload-box {
  background: white;
  border-radius: 14px;
  padding: 25px;
  margin-bottom: 30px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
}

.form-group textarea {
  resize: vertical;
}

.form-group small {
  display: block;
  margin-top: 6px;
  color: #6b7280;
}

.submit-button {
  border: none;
  background: #2563eb;
  color: white;
  padding: 12px 22px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}

.submit-button:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

#uploadMessage {
  margin-top: 15px;
  line-height: 1.8;
}
    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .header h1 {
        font-size: 18px;
      }

      .container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>سامانه دانش‌آموزی</h1>

    <button class="logout" onclick="logout()">
      خروج
    </button>
  </header>


  <main class="container">

    <section class="welcome">

      <h2 id="welcomeMessage">
        در حال بارگذاری...
      </h2>

      <div class="user-info">
        <div>
          <strong>نام کاربری:</strong>
          <span id="username">-</span>
        </div>

        <div>
          <strong>شناسه دانش‌آموز:</strong>
          <span id="userId">-</span>
        </div>
      </div>

    </section>


    <h2 class="section-title">
      📚 تکالیف من
    </h2>
<section class="upload-box">

  <h2 class="section-title">
    📤 ارسال تکلیف
  </h2>

  <div class="form-group">

    <label for="activityTitle">
      عنوان تکلیف
    </label>

    <input
      type="text"
      id="activityTitle"
      placeholder="مثلاً: تکلیف فصل اول"
    >

  </div>


  <div class="form-group">

    <label for="activityDescription">
      توضیحات
    </label>

    <textarea
      id="activityDescription"
      rows="4"
      placeholder="توضیحات مربوط به تکلیف..."
    ></textarea>

  </div>


  <div class="form-group">

    <label for="activityFile">
      فایل تکلیف
    </label>

    <input
      type="file"
      id="activityFile"
      accept="application/pdf,.pdf,image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif"
    >

    <small>
      فایل PDF یا عکس (JPG/PNG/HEIC) مجاز است.
    </small>

  </div>


  <button
    class="submit-button"
    onclick="submitActivity()"
  >
    📤 ارسال تکلیف
  </button>


  <div id="uploadMessage"></div>

</section>

    <section id="activitiesContainer">

      <div class="loading">
        در حال دریافت تکالیف...
      </div>

    </section>

  </main>


  <script>

    function toPersianDate(input) {
      const date = new Date(input);
      const gy = date.getFullYear();
      const gm = date.getMonth() + 1;
      const gd = date.getDate();

      function div(a, b) { return Math.floor(a / b); }

      let gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = 355666 + (365 * gy) + div(gy2 + 399, 400) - div(gy2 + 99, 100) + div(gy2, 4) + gd + [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334][gm - 1];

      let jy = -1595 + (33 * div(days, 12053));
      days %= 12053;
      jy += 4 * div(days, 1461);
      days %= 1461;
      if (days > 365) {
        jy += div(days - 1, 365);
        days = (days - 1) % 365;
      }

      let jm, jd;
      if (days < 186) {
        jm = 1 + div(days, 31);
        jd = 1 + (days % 31);
      } else {
        jm = 7 + div(days - 186, 30);
        jd = 1 + ((days - 186) % 30);
      }

      const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      function toPersianNum(n) {
        return String(n).split('').map(d => persianDigits[d] || d).join('');
      }

      return toPersianNum(jy) + '/' + toPersianNum(String(jm).padStart(2, '0')) + '/' + toPersianNum(String(jd).padStart(2, '0'));
    }

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx-9uxxqe9EXAsWLSD8QZ5vrsKQUbjnH-uL9sC_SpDQnp8EKqjztJDcKnu_zx_lFfya/exec";


    // دریافت اطلاعات ذخیره‌شده بعد از ورود
    const sessionId = localStorage.getItem("sessionId");
    const userData = localStorage.getItem("user");


    // اگر Session وجود نداشت، برگشت به صفحه ورود
    if (!sessionId || !userData) {

      window.location.href = "index.html";

    }


    let user;

    try {

      user = JSON.parse(userData);

    } catch (error) {

      localStorage.clear();
      window.location.href = "index.html";

    }


    // نمایش اطلاعات دانش‌آموز
    document.getElementById("welcomeMessage").textContent =
      `سلام ${user.firstName} ${user.lastName} عزیز 🌷`;

    document.getElementById("username").textContent =
      user.userId || "-";

    document.getElementById("userId").textContent =
      user.userId || "-";


    // دریافت تکالیف دانش‌آموز
    async function loadActivities() {

      const container =
        document.getElementById("activitiesContainer");


      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: "getActivities",

            sessionId: sessionId

          })

        });


        const result = await response.json();


        if (!result.success) {

          throw new Error(
            result.message || "دریافت تکالیف ناموفق بود."
          );

        }


        const activities = result.activities || [];


        if (activities.length === 0) {

          container.innerHTML = `
            <div class="empty">
              هنوز تکلیفی برای شما ثبت نشده است. 📭
            </div>
          `;

          return;
        }


        container.innerHTML = "";


        activities.forEach(activity => {

          const card =
            document.createElement("div");

          card.className = "activity-card";


          const submittedDate =
            activity.submittedAt
              ? toPersianDate(activity.submittedAt)
              : "-";


          const score =
            activity.score !== ""
              ? activity.score
              : "هنوز نمره ثبت نشده";


          const teacherComment =
            activity.teacherComment
              ? activity.teacherComment
              : "هنوز نظری از طرف معلم ثبت نشده است.";


          card.innerHTML = `

            <h3>
              📘 ${escapeHtml(activity.title)}
            </h3>

            <div class="description">
              ${escapeHtml(activity.description || "")}
            </div>

            <div class="meta">

              <div>
                📄 فایل:
                ${escapeHtml(activity.fileName || "-")}
              </div>

              <div>
                🕒 تاریخ ارسال:
                ${submittedDate}
              </div>

              <div>
                📝 نمره:
                ${escapeHtml(String(score))}
              </div>

              <div>
                💬 نظر معلم:
                ${escapeHtml(teacherComment)}
              </div>

              <div class="status">
                وضعیت: ${escapeHtml(activity.status || "-")}
              </div>

            </div>

          `;


          container.appendChild(card);

        });


      } catch (error) {

        console.error(error);


        container.innerHTML = `

          <div class="error">

            ❌ دریافت تکالیف با خطا مواجه شد.

            <br><br>

            ${escapeHtml(error.message)}

          </div>

        `;

      }

    }


    // جلوگیری از ورود HTML ناخواسته به صفحه
    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    // خروج
    function logout() {

      localStorage.removeItem("sessionId");
      localStorage.removeItem("user");

      window.location.href = "index.html";

    }

async function submitActivity() {

  const title =
    document.getElementById("activityTitle").value.trim();

  const description =
    document.getElementById("activityDescription").value.trim();

  const fileInput =
    document.getElementById("activityFile");

  const message =
    document.getElementById("uploadMessage");


  // بررسی عنوان
  if (!title) {

    message.innerHTML =
      "❌ لطفاً عنوان تکلیف را وارد کنید.";

    return;
  }


  // بررسی فایل
  if (!fileInput.files.length) {

    message.innerHTML =
      "❌ لطفاً یک فایل PDF انتخاب کنید.";

    return;
  }


  const file =
    fileInput.files[0];


  // بررسی نوع فایل
  const allowedFileTypes = [
    "application/pdf",
    "image/jpeg",
    "image/png",
    "image/heic",
    "image/heif"
  ];

  if (!allowedFileTypes.includes(file.type)) {

    message.innerHTML =
      "❌ فقط فایل PDF یا عکس (JPG/PNG/HEIC) مجاز است.";

    return;
  }


  // محدودیت حجم: 10 مگابایت
  if (file.size > 10 * 1024 * 1024) {

    message.innerHTML =
      "❌ حجم فایل نباید بیشتر از 10 مگابایت باشد.";

    return;
  }


  const button =
    document.querySelector(".submit-button");


  button.disabled = true;

  button.textContent =
    "⏳ در حال ارسال...";

  message.innerHTML =
    "لطفاً صبر کنید...";


  try {

    // تبدیل فایل به Base64
    const base64 =
      await fileToBase64(file);


    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "submitActivity",

          sessionId: sessionId,

          title: title,

          description: description,

          fileName: file.name,

          mimeType: file.type,

          fileBase64: base64

        })

      });


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "ارسال تکلیف ناموفق بود."
      );

    }


    message.innerHTML = `
      <div style="
        background:#dcfce7;
        color:#166534;
        padding:12px;
        border-radius:8px;
      ">
        ✅ تکلیف با موفقیت ارسال شد.
      </div>
    `;


    // پاک کردن فرم
    document.getElementById(
      "activityTitle"
    ).value = "";

    document.getElementById(
      "activityDescription"
    ).value = "";

    fileInput.value = "";


    // دریافت دوباره تکالیف
    await loadActivities();


  } catch (error) {

    console.error(error);


    message.innerHTML = `
      <div style="
        background:#fee2e2;
        color:#991b1b;
        padding:12px;
        border-radius:8px;
      ">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;


  } finally {

    button.disabled = false;

    button.textContent =
      "📤 ارسال تکلیف";

  }

}
    function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          reader.result;


        // حذف قسمت
        // data:application/pdf;base64,
        const base64 =
          result.split(",")[1];


        resolve(base64);

      };


      reader.onerror = () => {

        reject(
          new Error(
            "خواندن فایل ناموفق بود."
          )
        );

      };


      reader.readAsDataURL(file);

    }
  );

}
    // شروع دریافت اطلاعات
    loadActivities();

  </script>

</body>
</html>
