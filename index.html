<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود به سامانه دانش‌آموزی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f8fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #1e3a5f;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d6dfe7;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4b91c9;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2675ad;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d6091;
    }

    button:disabled {
      background: #9bb7ca;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .success {
      color: #218838;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🎓</div>

    <h1>سامانه دانش‌آموزی</h1>

    <div class="subtitle">
      برای ورود، نام کاربری و رمز عبور خود را وارد کنید.
    </div>

    <form id="loginForm">

      <label for="username">نام کاربری</label>
      <input
        type="text"
        id="username"
        placeholder="نام کاربری"
        required
      >

      <label for="password">رمز عبور</label>
      <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        required
      >

      <button type="submit" id="loginButton">
        ورود به سامانه
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx-9uxxqe9EXAsWLSD8QZ5vrsKQUbjnH-uL9sC_SpDQnp8EKqjztJDcKnu_zx_lFfya/exec";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "";
      message.className = "";

      loginButton.disabled = true;
      loginButton.textContent = "در حال ورود...";

      try {

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "login",
            username: username,
            password: password
          })
        });

        const result = await response.json();

        if (result.success) {

          message.textContent =
            "ورود موفق بود. خوش آمدید " +
            result.user.firstName + " " +
            result.user.lastName + " 🌷";

          message.className = "success";

          // فعلاً Session را ذخیره می‌کنیم
          localStorage.setItem(
            "sessionId",
            result.sessionId
          );

          localStorage.setItem(
            "user",
            JSON.stringify(result.user)
          );

          // مرحله بعدی: انتقال به داشبورد
          window.location.href = "dashboard.html";

        } else {

          message.textContent =
            result.message || "نام کاربری یا رمز عبور اشتباه است.";

          message.className = "error";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "خطا در ارتباط با سامانه.";

        message.className = "error";

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "ورود به سامانه";

      }

    });

  </script>

</body>
</html>
